name: reference_spatial_negative
version: 1.0.0
description: Causal attribute-dependent negative fault. Diagnostic fixture for ungauged-basin-closure;
  not a scientific model.
authors:
- Shunan Zhou
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint:
- python3
- ../_spatial_faults/ht_adapter.py
- --fault
- negative
timestep: PT1D
emits:
  fluxes:
  - pr
  - evspsbl
  - mrro
  states:
  - mrso
  - snw
  - canopy
  - channel
needs_forcing:
- pr
- tas
- pet
supports:
  perturbation: true
resources:
  cpu: 1
  memory_gb: 1
  gpu: false
