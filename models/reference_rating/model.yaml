name: reference_rating
version: "1.0.0"
description: >
  The bucket, with a real rating curve. Discharge is routed through a
  triangular unit hydrograph and stage is solved from it with Manning's
  equation in a rectangular reach, so the gauge rises with the flow and, on
  a falling recession, sits above where it sat on the way up at the same
  discharge. It pins stage-discharge monotonicity from the passing side.
authors: ["HydroTuring maintainers"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: [PT1D, PT1H, PT15M, PT5M, PT1M]
emits:
  fluxes: [pr, evspsbl, mrro, dis]
  states: [mrso, snw, canopy, channel]
  diagnostics: [stage]
needs_forcing: [pr, tas, pet]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
